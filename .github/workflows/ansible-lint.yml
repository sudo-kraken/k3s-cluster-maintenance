---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Ansible Lint

on:
  push:
    paths:
      - maintenance.yml
      - roles/**
      - group_vars/**
      - collections/**
      - hosts.example.yml
      - ansible.cfg
      - install-collections.sh
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/ansible-lint.yml
      - .github/workflows/release.yml
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ansible-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible-lint:
    name: Lint Ansible Playbooks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: ".python-version"

      - name: Install the project
        run: uv sync --locked --extra ansible

      - name: Install Ansible collections
        run: uv run ansible-galaxy collection install -r collections/requirements.yml

      - name: Validate inventory and playbook syntax
        run: |
          uv run ansible-inventory -i hosts.example.yml --list >/dev/null
          uv run ansible-playbook -i hosts.example.yml maintenance.yml --syntax-check

      - name: Test repository safety contracts
        run: uv run python -m unittest discover -s tests -v

      - name: Validate installer shell syntax
        run: bash -n install-collections.sh

      - name: Lint Ansible playbooks and roles
        run: |
          uv run ansible-lint maintenance.yml roles/
