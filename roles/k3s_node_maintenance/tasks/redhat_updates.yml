---
# RedHat/CentOS package updates
- name: List upgradable packages
  become: true
  ansible.builtin.dnf:
    list: updates
    update_cache: true
  register: k3s_node_maintenance_dnf_upgrade_candidates
  until: k3s_node_maintenance_dnf_upgrade_candidates is succeeded
  retries: "{{ k3s_node_maintenance_update_cache_retries | default(3) | int }}"
  delay: "{{ k3s_node_maintenance_update_cache_delay | default(10) | int }}"
  tags: [packages, updates, redhat, list]

- name: Parse package list
  ansible.builtin.set_fact:
    k3s_node_maintenance_dnf_packages_to_upgrade: >-
      {{
        k3s_node_maintenance_dnf_upgrade_candidates.results
        | map(attribute='name')
        | list
      }}
  tags: [packages, updates, redhat, parse]

- name: "Upgrading packages: {{ k3s_node_maintenance_dnf_packages_to_upgrade | length }}"
  become: true
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_only: true
    update_cache: true
  register: k3s_node_maintenance_dnf_upgrade_result
  when:
    - k3s_node_maintenance_dnf_packages_to_upgrade is defined
    - k3s_node_maintenance_dnf_packages_to_upgrade | length > 0
  tags: [packages, updates, redhat, upgrade]

- name: Check reboot requirement with needs-restarting
  become: true
  ansible.builtin.command:
    argv:
      - needs-restarting
      - -r
  register: k3s_node_maintenance_needs_restarting_result
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['os_family'] == 'RedHat'
  tags: [packages, updates, redhat, reboot_check]

- name: Determine RedHat reboot requirement
  ansible.builtin.set_fact:
    k3s_node_maintenance_dnf_reboot_required: >-
      {{
        k3s_node_maintenance_needs_restarting_result.rc == 1
        or (
          k3s_node_maintenance_needs_restarting_result.rc not in [0, 1]
          and (k3s_node_maintenance_dnf_upgrade_result.changed | default(false) | bool)
          and (
            k3s_node_maintenance_dnf_packages_to_upgrade
            | default([])
            | select('match', '^(kernel|systemd|linux-firmware|glibc)(-|$)')
            | list
            | length > 0
          )
        )
      }}
  tags: [packages, updates, redhat, reboot_check]
