---
# Prerequisites and pre-flight checks
- name: Gather OS family facts
  ansible.builtin.setup:
    gather_subset:
      - 'os_family'
  tags: [always, prerequisites, setup]

- name: Validate supported operating system family
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['Debian', 'RedHat']
    fail_msg: >-
      Unsupported operating system family {{ ansible_facts['os_family'] }}.
      Supported families are Debian and RedHat.
  tags: [prerequisites]

- name: Check target package manager
  become: true
  ansible.builtin.command:
    argv:
      - "{{ 'apt-get' if ansible_facts['os_family'] == 'Debian' else 'dnf' }}"
      - --version
  register: k3s_node_maintenance_tools_check
  changed_when: false
  tags: [prerequisites]
